name: Verify dotfiles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi
        shell: bash
        run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/dotfiles-bin"
          echo "$RUNNER_TEMP/dotfiles-bin" >> "$GITHUB_PATH"
      - name: Install Linux test shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh neovim
      - name: Install macOS test shells
        if: runner.os == 'macOS'
        run: brew install fish zsh neovim
      - name: Verify Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/verify-unix.sh
      - name: Verify Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/verify-windows.ps1
